name: Blender extension

on:
  push:
    paths: ['blender/**', 'Source/installer/blender_setup.py', 'ci/*blender*', '.github/workflows/blender.yaml']
  pull_request:
    paths: ['blender/**', 'Source/installer/blender_setup.py', 'ci/*blender*', '.github/workflows/blender.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blender: ['4.2.9', '4.5.9', '5.2.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libgl1 libegl1
      - run: bash ci/download_blender.sh '${{ matrix.blender }}' "$RUNNER_TEMP/blender"
      - name: Build and test repository installation
        run: |
          BLENDER="$RUNNER_TEMP/blender/blender-${{ matrix.blender }}-linux-x64/blender"
          python ci/build_blender_extension.py --blender "$BLENDER" --output "$RUNNER_TEMP/repository"
          python ci/test_blender_extension.py --blender "$BLENDER" --repository "$RUNNER_TEMP/repository"
      - uses: actions/upload-artifact@v4
        if: matrix.blender == '4.2.9'
        with:
          name: blender-repository
          path: ${{ runner.temp }}/repository
